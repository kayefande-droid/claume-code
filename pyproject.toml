[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claume-code"
version = "2.3.4"
description = "Pixel-animated CLI coding agent with animated thinking, voice I/O, skills, MCP server control, mouse-tracking mascot and a free NVIDIA NIM proxy — like Claude Code, but free."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TRacKay" }]
keywords = ["cli", "agent", "coding", "nvidia", "nim", "free"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
claume = "claume.cli:main"

[tool.setuptools.packages.find]
include = ["claume*"]
